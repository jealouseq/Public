<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/fonts/post.css"><link rel="stylesheet" href="/fonts/post2.css"><title>ЦПР — пост «Личное — не в комментарии»</title>
<style>
:root{--ink:#11150f;--paper:#ebe2ca;--olive:#34441f;--rust:#a8412b;--m:72px}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;background:radial-gradient(120% 100% at 30% 10%,#f3ecd6,var(--paper) 55%,#ddd3b6);color:var(--ink);font-family:Manrope,sans-serif}
.top{position:absolute;left:var(--m);right:var(--m);top:56px;display:flex;justify-content:space-between;font:600 21px Oswald;letter-spacing:.24em;padding-bottom:24px;border-bottom:2.5px solid var(--ink)}
.top span:last-child{color:var(--rust)}
.cm{position:absolute;left:var(--m);right:var(--m);top:178px}
.who{display:flex;align-items:center;gap:20px;margin-bottom:46px}
.av{width:70px;height:70px;border-radius:50%;border:2.5px solid var(--ink)}
.bar{display:inline-block;background:var(--ink);height:34px;border-radius:5px;vertical-align:middle}
.who small{display:block;font:500 24px Manrope;color:rgba(17,21,15,.5);margin-top:8px}
.row{display:flex;align-items:center;gap:22px;height:96px;font:700 44px Manrope;letter-spacing:-.01em}
.row span{flex:none;font:600 26px Oswald;letter-spacing:.22em;color:var(--olive);width:190px}
.row .bar{height:50px}
h1{position:absolute;left:var(--m);top:780px;margin-left:-5px;font:600 132px/.98 'Cormorant Garamond',serif;letter-spacing:-.035em}
h1 span{display:block;white-space:nowrap}
h1 u{text-decoration:none;position:relative;display:inline-block;isolation:isolate}
h1 u:after{content:"";position:absolute;left:0;right:0;bottom:6px;height:16px;background:var(--rust);opacity:.88;transform:skewX(-12deg);z-index:-1}
.sub{position:absolute;left:var(--m);top:1076px;font:500 34px/1.4 Manrope;color:#2a3020;width:740px}
.sub b{font-weight:800}
.foot{position:absolute;left:var(--m);right:var(--m);bottom:50px;padding-top:22px;border-top:2.5px solid var(--ink);display:flex;justify-content:flex-start;font:600 20px Oswald;letter-spacing:.22em}
.foot span:last-child{color:var(--olive)}
.tex{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.5;pointer-events:none}
</style></head><body><div class="post" id="post">
<div class="top"><span>ЦЕНТР ПОИСКОВЫХ РЕШЕНИЙ</span><span>ВАЖНО</span></div>
<div class="cm"><div class="who"><div class="av"></div><div><span class="bar" style="width:260px"></span><small>комментарий · только что</small></div></div>
<div class="row"><span>ФИО</span><i class="bar" style="width:520px"></i></div>
<div class="row"><span>ЧАСТЬ</span><i class="bar" style="width:380px"></i></div>
<div class="row"><span>ТЕЛЕФОН</span><i class="bar" style="width:560px"></i></div>
<div class="row"><span>АДРЕС</span><i class="bar" style="width:440px"></i></div></div>
<h1><span>Личное —</span><span><u>не в комментарии.</u></span></h1>
<div class="sub">Пишите нам <b>лично</b> — так надёжнее для вас и для того, кого вы ищете.</div>
<div class="foot"><span>КОНТАКТЫ — В ОПИСАНИИ КАНАЛА</span></div>
<svg class="tex" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="3"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .4  0 0 0 .5 -.08"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg></div></body></html>
