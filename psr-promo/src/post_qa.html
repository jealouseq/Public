<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>ЦПР — пост «Сколько ждать ответа?»</title>
<link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/fonts/post.css"><link rel="stylesheet" href="/fonts/post2.css">
<style>

<h1><span>Сколько</span><span>ждать ответа?</span></h1>

<div class="lab a"><i></i>ОТВЕТ</div>
<div class="ans">Каждый случай разный, поэтому <b>сроков заранее мы не называем</b>. Зато честно говорим, что делаем и что известно сейчас.</div>
