<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>ЦПР — пост «Одна галочка»</title>
<link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/fonts/post.css"><link rel="stylesheet" href="/fonts/post2.css">
<style>
:root{--ink:#080b09;--sand:#f1e8d0;--gold:#f2c46f;--mute:#8a957c;--m:64px}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--ink);color:var(--sand);font-family:Manrope,sans-serif}
.bg{position:absolute;inset:0;background:
 radial-gradient(640px 520px at 52% 50%,rgba(242,196,111,.30),rgba(242,196,111,.07) 60%,transparent 78%),
 radial-gradient(900px 700px at 100% 0%,rgba(52,74,40,.55),transparent 70%),
 radial-gradient(800px 600px at 0% 100%,rgba(40,58,32,.5),transparent 70%),
 linear-gradient(180deg,#0b100c,#070a08)}
.cols{position:absolute;inset:0}
.cols i{position:absolute;top:0;bottom:0;width:1px;background:rgba(190,200,170,.07)}
.top{position:absolute;left:var(--m);right:var(--m);top:56px;display:flex;justify-content:space-between;align-items:center;font:600 21px Oswald;letter-spacing:.24em;color:#cfd6bf}
.top span:last-child{color:var(--mute);font-weight:500}
.top:after{content:"";position:absolute;left:0;right:0;top:46px;height:1.5px;background:rgba(190,200,170,.28)}
.pill{position:absolute;left:var(--m);top:158px;padding:10px 24px;border-radius:30px;background:rgba(138,149,124,.18);font:600 24px Manrope;letter-spacing:.05em;color:#cdd6c0}
.bub{position:absolute;right:var(--m);top:206px;padding:24px 38px 20px;border-radius:34px 34px 8px 34px;background:linear-gradient(160deg,#577a42,#36502a);font:500 78px/1.1 Manrope;letter-spacing:-.015em;color:#f6efdb;box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 34px 80px rgba(0,0,0,.6),0 0 100px rgba(242,196,111,.22)}
.bub:after{content:"";position:absolute;right:-13px;bottom:0;width:26px;height:28px;background:#36502a;clip-path:path('M0 0V28H26C11 26 3 15 0 0Z')}
.bub .m{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:6px;font:500 26px Manrope;color:rgba(255,240,205,.85)}
.bub .m svg{width:34px;height:25px;fill:none;stroke:#ffd98f;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
svg.hero{position:absolute;left:0;top:360px;width:1080px;height:520px;overflow:visible}
.ann{position:absolute;left:622px;top:836px;font:600 23px Oswald;letter-spacing:.2em;color:var(--gold)}
.ann i{position:absolute;left:-22px;top:-66px;width:2px;height:96px;background:linear-gradient(180deg,rgba(242,196,111,0),var(--gold))}
h1{position:absolute;left:var(--m);top:884px;font:600 160px/.92 'Cormorant Garamond',serif;letter-spacing:-.04em;color:#f8f1de;text-shadow:0 10px 50px rgba(0,0,0,.6);margin-left:-6px}
h1 span{display:block;white-space:nowrap}
h1 .g{color:var(--gold);font-weight:700;text-shadow:0 0 60px rgba(242,196,111,.30)}
.col{position:absolute;left:700px;right:var(--m);top:1016px;padding-top:22px;border-top:2.5px solid var(--gold);font:500 29px/1.36 Manrope;color:#d9d3bd}
.col b{color:#f8f1de;font-weight:700}
.foot{position:absolute;left:var(--m);right:var(--m);bottom:46px;height:76px;border-top:1.5px solid rgba(190,200,170,.28);display:flex;align-items:center;justify-content:space-between;font:600 21px Oswald;letter-spacing:.2em;color:#cfd6bf}
.foot .l{display:flex;align-items:center;gap:16px}
.mark{width:46px;height:46px;background:var(--sand);color:#0c100b;display:grid;place-items:center;font:700 21px Oswald;letter-spacing:.02em;clip-path:polygon(0 0,86% 0,100% 14%,100% 100%,0 100%)}
.foot .r{color:var(--gold);font-weight:500}
.grain{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.24;pointer-events:none}
.vig{position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 42%,transparent 58%,rgba(0,0,0,.6))}
</style></head>
<body><div class="post" id="post">
<div class="bg"></div>
<div class="cols"><i style="left:64px"></i><i style="left:540px"></i><i style="left:1016px"></i></div>
<div class="top"><span>ЦЕНТР ПОИСКОВЫХ РЕШЕНИЙ</span><span>РОЗЫСК · СВО</span></div>
<div class="pill">21-й день</div>
<div class="bub">Мы ждём тебя<div class="m">23:58 <svg viewBox="0 0 34 25"><path d="M4 13l8 8L30 4"/></svg></div></div>

<svg class="hero" viewBox="0 0 1080 520" fill="none" stroke-linecap="round" stroke-linejoin="round">
 <defs>
  <linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3cf"/><stop offset=".35" stop-color="#f6c970"/><stop offset=".75" stop-color="#d79a3b"/><stop offset="1" stop-color="#a8721f"/></linearGradient>
  <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd98f" stop-opacity=".65"/><stop offset="1" stop-color="#ffd98f" stop-opacity=".05"/></linearGradient>
  <filter id="gl" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="sh" x="-20%" y="-20%" width="150%" height="170%"><feDropShadow dx="14" dy="26" stdDeviation="18" flood-color="#000" flood-opacity=".55"/></filter>
 </defs>
 <!-- pointer from the bubble tick to the big one -->
 <path d="M968 -22 C 900 90, 640 120, 486 118" stroke="rgba(255,217,143,.55)" stroke-width="1.8" stroke-dasharray="3 7"/><circle cx="470" cy="106" r="9" stroke="#ffd98f" stroke-width="2.4" fill="rgba(255,217,143,.25)"/>
 <!-- the missing second tick -->
 <path d="M470 250 L600 380 L820 100" stroke="rgba(242,196,111,.80)" stroke-width="28" stroke-dasharray="1 58"/>
 <!-- the delivered tick -->
 <path d="M120 250 L250 380 L470 100" stroke="#ffd37a" stroke-width="86" filter="url(#gl)" opacity=".5"/>
 <g filter="url(#sh)"><path d="M120 250 L250 380 L470 100" stroke="url(#gd)" stroke-width="74"/></g>
 <path d="M122 242 L250 366 L466 92" stroke="rgba(255,255,255,.55)" stroke-width="5"/>
</svg>
<div class="ann"><i></i>ВТОРОЙ ГАЛОЧКИ — НЕТ</div>

<h1><span>Мы ищем</span><span class="g">ответ.</span></h1>
<div class="col"><b>Профессиональный розыск</b> пропавших бойцов в&nbsp;зоне&nbsp;СВО.</div>
<div class="foot"><div class="l"><div class="mark">ЦПР</div><span>ЦЕНТР ПОИСКОВЫХ РЕШЕНИЙ</span></div><div class="r">КОНТАКТЫ — В ОПИСАНИИ КАНАЛА</div></div>
<div class="vig"></div>
<svg class="grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="11"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.3 -.3"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div></body></html>
