<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>ЦПР — пост «Одна галочка»</title>
<link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/fonts/post.css"><link rel="stylesheet" href="/fonts/post2.css">
<style>
:root{--ink:#090c0a;--bub:#2f3f27;--sand:#efe6cf;--gold:#f2c46f;--gold2:#ffe2a3;--mute:#8d987f}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--ink);color:var(--sand);font-family:Manrope,sans-serif}
.glow{position:absolute;inset:0;background:
 radial-gradient(560px 420px at 66% 50%,rgba(242,196,111,.34),rgba(242,196,111,.09) 58%,transparent 76%),
 radial-gradient(700px 520px at 8% 22%,rgba(60,84,48,.30),transparent 70%),
 radial-gradient(900px 600px at 80% 110%,rgba(40,56,32,.55),transparent 70%)}
.bokeh{position:absolute;inset:0}
.hdr{position:absolute;left:64px;right:64px;top:52px;display:flex;align-items:center;gap:22px}
.back{width:20px;height:34px;fill:none;stroke:var(--mute);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;margin-right:-4px}
.av{width:76px;height:76px;border-radius:50%;background:#161c15;box-shadow:inset 0 0 0 2px rgba(141,152,127,.45);display:grid;place-items:center}
.av svg{width:42px;height:42px;fill:none;stroke:var(--mute);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1 7.5}
.hdr b{display:block;font:700 32px Manrope}.hdr small{display:block;font:500 25px Manrope;color:var(--mute);margin-top:4px}
.line{position:absolute;left:64px;right:64px;top:148px;height:1.5px;background:linear-gradient(90deg,rgba(141,152,127,.35),rgba(141,152,127,.1))}
.pill{position:absolute;left:50%;padding:10px 26px;border-radius:30px;background:rgba(141,152,127,.16);font:600 25px Manrope;letter-spacing:.04em;color:#c9d2bd;white-space:nowrap}
.msg{position:absolute;right:64px;transform-origin:100% 50%}
.bub{position:relative;display:inline-block;background:linear-gradient(165deg,#3a4d30,#2b3a24);color:var(--sand);padding:22px 30px 20px;border-radius:30px 30px 7px 30px;font:500 52px/1.12 Manrope;letter-spacing:-.012em;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.12),0 18px 40px rgba(0,0,0,.45)}
.bub:after{content:"";position:absolute;right:-12px;bottom:0;width:24px;height:26px;background:#2b3a24;clip-path:path('M0 0V26H24C10 24 3 14 0 0Z')}
.bub .m{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:8px;font:500 24px Manrope;color:rgba(239,230,207,.62)}
.bub svg{width:30px;height:22px;fill:none;stroke:rgba(239,230,207,.62);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.last{background:linear-gradient(160deg,#557640,#385029);font-size:80px;padding:26px 36px 22px;box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 36px 90px rgba(0,0,0,.6),0 0 110px rgba(242,196,111,.26)}
.last:after{background:#385029}
.last .m{font-size:28px;visibility:hidden} .last svg{stroke:var(--gold);width:38px;height:28px}
.lens{position:absolute;left:722px;top:726px;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#1c261a,#0a0e09 72%);box-shadow:0 0 0 3.5px var(--gold),0 0 0 12px rgba(242,196,111,.14),0 30px 70px rgba(0,0,0,.7),0 0 80px rgba(242,196,111,.30),inset 0 0 40px rgba(242,196,111,.10);display:grid;place-items:center}
.lens:before{content:"";position:absolute;inset:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(242,196,111,.35)}
.lens:after{content:"";position:absolute;left:46px;top:26px;width:92px;height:40px;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.2),transparent);transform:rotate(-24deg)}
.lens .t{position:absolute;top:46px;left:0;right:0;text-align:center;font:600 30px Manrope;color:rgba(255,240,205,.85);letter-spacing:.03em}
.lens svg{width:176px;height:97px;margin-top:30px;overflow:visible}
.handle{position:absolute;left:928px;top:930px;width:96px;height:20px;border-radius:12px;background:linear-gradient(180deg,#f7d58f,#b88a3d);transform:rotate(48deg);transform-origin:0 50%;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.note{position:absolute;left:64px;right:376px;top:834px;display:flex;align-items:center;gap:16px;font:600 25px Oswald;letter-spacing:.2em;color:var(--gold)}
.note i{display:block;flex:1;height:2px;background:linear-gradient(90deg,var(--gold),rgba(242,196,111,.0));}
h1{position:absolute;left:50px;top:906px;font:600 206px/.9 'Cormorant Garamond',serif;letter-spacing:-.04em;color:#f7f0de;text-shadow:0 8px 50px rgba(0,0,0,.6)}
h1 span{display:block;white-space:nowrap}
h1 .g{color:var(--gold);margin-left:236px;font-weight:700;text-shadow:0 0 60px rgba(242,196,111,.32)}
.brand{position:absolute;left:64px;bottom:54px;width:200px}
.mark{width:50px;height:50px;background:var(--sand);color:#0c100b;display:grid;place-items:center;font:700 23px Oswald;letter-spacing:.02em;clip-path:polygon(0 0,86% 0,100% 14%,100% 100%,0 100%);margin-bottom:12px}
.brand b{display:block;font:600 19px/1.45 Oswald;letter-spacing:.16em;color:#d5cdb0}
.brand small{display:block;margin-top:8px;font:500 15px/1.4 Oswald;letter-spacing:.18em;color:var(--mute)}
.grain{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.24;pointer-events:none}
.vig{position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 40%,transparent 55%,rgba(0,0,0,.65))}
</style></head>
<body><div class="post" id="post">
<div class="glow"></div>
<svg class="bokeh" width="1080" height="1350" id="bk"></svg>
<div class="hdr"><svg class="back" viewBox="0 0 20 34"><path d="M17 3L4 17l13 14"/></svg><div class="av"><svg viewBox="0 0 44 44"><circle cx="22" cy="16" r="8"/><path d="M6 40c2-10 10-14 16-14s14 4 16 14"/></svg></div><div><b>Не в сети</b><small>был(а) давно</small></div></div>
<div class="line"></div>

<div class="pill" style="top:176px;transform:translateX(-50%) scale(.8);opacity:.42">3-й день</div>
<div class="msg" style="top:226px;transform:scale(.6);opacity:.42;filter:blur(1.8px)"><div class="bub">Ты как?<div class="m">09:41 <svg viewBox="0 0 30 22"><path d="M3 12l7 7L25 3"/></svg></div></div></div>

<div class="pill" style="top:344px;transform:translateX(-50%) scale(.9);opacity:.68">10-й день</div>
<div class="msg" style="top:396px;transform:scale(.8);opacity:.74;filter:blur(.5px)"><div class="bub">Напиши, как сможешь<div class="m">21:15 <svg viewBox="0 0 30 22"><path d="M3 12l7 7L25 3"/></svg></div></div></div>

<div class="pill" style="top:546px;transform:translateX(-50%)">21-й день</div>
<div class="msg" style="top:602px"><div class="bub last">Мы ждём тебя<div class="m">23:58 <svg viewBox="0 0 30 22"><path d="M3 12l7 7L25 3"/></svg></div></div></div>

<div class="lens"><div class="t">23:58</div>
 <svg viewBox="0 0 200 110" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M96 58l30 30 66-70" stroke="rgba(242,196,111,.55)" stroke-width="9" stroke-dasharray="2 17"/>
  <path d="M10 58l30 30 66-70" stroke="#ffd98f" stroke-width="11" style="filter:drop-shadow(0 0 14px rgba(255,200,110,.7))"/>
 </svg></div>
<div class="handle"></div>
<div class="note">ВТОРОЙ ГАЛОЧКИ — НЕТ<i></i></div>

<h1><span>Мы ищем</span><span class="g">ответ.</span></h1>
<div class="brand"><div class="mark">ЦПР</div><b>ЦЕНТР<br>ПОИСКОВЫХ<br>РЕШЕНИЙ</b><small>РОЗЫСК<br>В ЗОНЕ СВО</small></div>
<div class="vig"></div>
<svg class="grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="11"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.3 -.3"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
<script>
let s=21;const r=()=>((s=(s*1664525+1013904223)>>>0)/4294967296);let h='';
for(let i=0;i<26;i++){const x=r()*1080,y=r()*620,rad=6+r()*26,a=.05+r()*.12;h+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${rad.toFixed(0)}" fill="rgba(242,196,111,${a.toFixed(2)})" style="filter:blur(${(rad*.35).toFixed(0)}px)"/>`;}
document.getElementById('bk').innerHTML=h;
</script></body></html>
