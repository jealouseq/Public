<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>ЦПР — пост «Одна галочка»</title>
<link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/fonts/post.css"><link rel="stylesheet" href="/fonts/post2.css">
<style>
:root{--ink:#0b0e0c;--bub:#33432a;--bub2:#3f5232;--sand:#efe6cf;--gold:#f0bf6b;--mute:#8f9a82}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--ink);color:var(--sand);font-family:Manrope,sans-serif}
.glow{position:absolute;inset:0;background:radial-gradient(520px 460px at 72% 52%,rgba(240,191,107,.30),rgba(240,191,107,.08) 55%,transparent 75%),radial-gradient(900px 700px at 20% 110%,rgba(51,67,42,.55),transparent 70%)}
.bigtick{position:absolute;left:-60px;top:260px;width:900px;height:900px;opacity:.16;transform:rotate(-6deg)}
.hdr{position:absolute;left:64px;right:64px;top:54px;display:flex;align-items:center;gap:22px}
.av{width:78px;height:78px;border-radius:50%;background:#1a201a;box-shadow:inset 0 0 0 2px rgba(143,154,130,.45);display:grid;place-items:center}
.av svg{width:44px;height:44px;fill:none;stroke:var(--mute);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1 7}
.hdr b{display:block;font:700 32px Manrope}.hdr small{display:block;font:500 25px Manrope;color:var(--mute);margin-top:4px}
.hdr .dot{margin-left:auto;font:600 20px Oswald;letter-spacing:.22em;color:var(--mute)}
.line{position:absolute;left:64px;right:64px;top:152px;height:1.5px;background:rgba(143,154,130,.28)}
.msg{position:absolute;right:64px;transform-origin:100% 50%}
.pill{position:absolute;left:50%;transform:translateX(-50%);padding:10px 26px;border-radius:30px;background:rgba(143,154,130,.18);font:600 25px Manrope;letter-spacing:.04em;color:#c9d2bd;white-space:nowrap}
.bub{position:relative;display:inline-block;background:var(--bub);color:var(--sand);padding:22px 30px 20px;border-radius:30px 30px 8px 30px;font:500 52px/1.12 Manrope;letter-spacing:-.01em}
.bub .m{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:8px;font:500 24px Manrope;color:rgba(239,230,207,.62)}
.bub svg{width:30px;height:22px;fill:none;stroke:rgba(239,230,207,.62);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.last{background:linear-gradient(160deg,#4d6a3a,#364a2a);box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 90px rgba(240,191,107,.22);font-size:76px}
.last .m{font-size:28px;color:rgba(255,240,205,.85)} .last svg{stroke:var(--gold);width:38px;height:28px}
.kick{position:absolute;left:64px;top:848px;font:600 26px Oswald;letter-spacing:.28em;color:var(--gold);display:flex;gap:18px;align-items:center}
.kick i{width:54px;height:2px;background:var(--gold)}
h1{position:absolute;left:52px;top:888px;font:600 196px/.9 'Cormorant Garamond',serif;letter-spacing:-.035em;color:#f6efdc}
h1 span{display:block;white-space:nowrap}
h1 .g{color:var(--gold);margin-left:230px;font-weight:700}
.foot{position:absolute;left:64px;right:64px;bottom:50px;display:flex;justify-content:space-between;align-items:flex-end;font:600 21px Oswald;letter-spacing:.2em;color:#b9c2ac}
.foot span:last-child{text-align:right;color:var(--mute);font-weight:500}
.grain{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.22;pointer-events:none}
.vig{position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 40%,transparent 55%,rgba(0,0,0,.6))}
</style></head>
<body><div class="post" id="post">
<div class="glow"></div>
<div class="hdr"><div class="av"><svg viewBox="0 0 44 44"><circle cx="22" cy="16" r="8"/><path d="M6 40c2-10 10-14 16-14s14 4 16 14"/></svg></div><div><b>Не в сети</b><small>был(а) давно</small></div><div class="dot">●</div></div>
<div class="line"></div>

<div class="pill" style="top:184px;transform:translateX(-50%) scale(.82);opacity:.45">3-й день</div>
<div class="msg" style="top:236px;transform:scale(.62);opacity:.45;filter:blur(1.6px)"><div class="bub">Ты как?<div class="m">09:41 <svg viewBox="0 0 30 22"><path d="M3 12l7 7L25 3"/></svg></div></div></div>

<div class="pill" style="top:366px;transform:translateX(-50%) scale(.9);opacity:.7">10-й день</div>
<div class="msg" style="top:418px;transform:scale(.8);opacity:.75;filter:blur(.5px)"><div class="bub">Напиши, как сможешь<div class="m">21:15 <svg viewBox="0 0 30 22"><path d="M3 12l7 7L25 3"/></svg></div></div></div>

<div class="pill" style="top:572px">21-й день</div>
<div class="msg" style="top:628px"><div class="bub last">Мы ждём тебя<div class="m">23:58 <svg viewBox="0 0 30 22"><path d="M3 12l7 7L25 3"/></svg></div></div></div>

<div class="kick"><i></i>КОГДА В ЧАТЕ — ОДНА ГАЛОЧКА</div>
<h1><span>Мы ищем</span><span class="g">ответ.</span></h1>
<div class="foot"><span>ЦЕНТР ПОИСКОВЫХ РЕШЕНИЙ</span><span>РОЗЫСК В ЗОНЕ СВО</span></div>
<div class="vig"></div>
<svg class="grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="11"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.3 -.3"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div></body></html>
