<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/fonts/post.css"><link rel="stylesheet" href="/fonts/post2.css"><title>ЦПР — пост «Начните с того, что знаете»</title>
<style>
:root{--ink:#080b09;--sand:#efe6cf;--gold:#f2c46f;--mute:#8d987f;--m:72px}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--ink);color:var(--sand);font-family:Manrope,sans-serif}
.bg{position:absolute;inset:0;background:radial-gradient(800px 600px at 0% 0%,rgba(40,58,34,.34),transparent 70%),linear-gradient(180deg,#0a0e0b,#070908)}
.L{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none}
.L1{background:radial-gradient(ellipse 360px 300px at 820px 700px,rgba(242,196,111,.20),rgba(242,196,111,.07) 50%,transparent 100%)}
.L2{background:radial-gradient(ellipse 900px 800px at 800px 640px,rgba(242,196,111,.15),rgba(242,196,111,.05) 55%,transparent 100%)}
.top{position:absolute;left:var(--m);right:var(--m);top:56px;display:flex;justify-content:space-between;font:600 21px Oswald;letter-spacing:.24em;color:#cfd6bf;padding-bottom:24px;border-bottom:1.5px solid rgba(141,152,127,.28)}
.top span:last-child{color:var(--mute);font-weight:500}
h1{position:absolute;left:var(--m);top:146px;margin-left:-5px;font:600 126px/.98 'Cormorant Garamond',serif;letter-spacing:-.035em;color:#f8f1de}
h1 span{display:block;white-space:nowrap}h1 .g{color:var(--gold);font-weight:700;text-shadow:0 0 40px rgba(242,196,111,.35)}
.card{position:absolute;left:96px;top:462px;width:888px;height:690px;transform:rotate(-2deg);border-radius:6px;padding:48px 60px;background:linear-gradient(200deg,#f7efd8,#eadfc2 60%,#dfd2b0);color:#141810;box-shadow:0 50px 100px rgba(0,0,0,.65),0 0 120px rgba(242,196,111,.16)}
.card:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(200deg,rgba(255,244,210,.55),transparent 55%);pointer-events:none}
.tape{position:absolute;left:50%;top:-22px;width:150px;height:44px;margin-left:-75px;background:rgba(214,196,142,.62);transform:rotate(1.5deg);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.ch{display:flex;justify-content:space-between;font:600 21px Oswald;letter-spacing:.24em;color:#4a5236;margin-bottom:26px}
.f{position:relative;height:104px;border-bottom:2px solid rgba(20,24,16,.7)}
.f b{position:absolute;left:0;top:16px;font:600 28px Oswald;letter-spacing:.2em;color:#3b4430}
.f small{position:absolute;right:0;top:20px;font:500 20px Manrope;color:rgba(20,24,16,.45)}
.note{position:absolute;left:60px;bottom:40px;font:italic 600 44px 'Cormorant Garamond',serif;color:#2c3322}
.foot{position:absolute;left:var(--m);right:var(--m);bottom:50px;display:flex;justify-content:space-between;font:600 20px Oswald;letter-spacing:.22em;color:#b9c2ac}
.foot span:last-child{color:var(--gold)}
.grain{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.22;pointer-events:none}
.vig{position:absolute;inset:0;background:radial-gradient(130% 105% at 50% 45%,transparent 60%,rgba(0,0,0,.5))}
</style></head><body><div class="post" id="post"><div class="bg"></div><div class="L L2"></div><div class="L L1"></div>
<div class="top"><span>ЦЕНТР ПОИСКОВЫХ РЕШЕНИЙ</span><span>ПАМЯТКА</span></div>
<h1><span>Начните с того,</span><span class="g">что знаете.</span></h1>
<div class="card"><div class="tape"></div><div class="ch"><span>СВЕДЕНИЯ О БОЙЦЕ</span><span>№ ______</span></div>
<div class="f"><b>ФИО</b></div><div class="f"><b>ПОЗЫВНОЙ</b></div><div class="f"><b>ЧАСТЬ</b><small>если известно</small></div><div class="f"><b>ГДЕ И КОГДА БЫЛ ПОСЛЕДНИЙ КОНТАКТ</b></div>
<div class="note">Нет чего-то — пропустите.</div></div>
<div class="foot"><span>ВЕЖЛИВО · БЕРЕЖНО · НА СВЯЗИ</span><span>КОНТАКТЫ — В ОПИСАНИИ КАНАЛА</span></div>
<div class="vig"></div><svg class="grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="11"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.3 -.3"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg></div></body></html>
