<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>ЦПР — анимированный пост</title>
<link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/fonts/post2.css">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1350"></canvas>
<script>
'use strict';
const W = 1080, H = 1350, FPS = 30, DUR = 9.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false });
const KHAKI = '185,169,122', SAND = '239,228,196', GOLD = '240,200,116';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sm = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const eo3 = (t) => 1 - Math.pow(1 - clamp(t), 3), eo5 = (t) => 1 - Math.pow(1 - clamp(t), 5);
const lerp = (a, b, t) => a + (b - a) * t;
// ---------- noise
function hash(x, y, z) { let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 2147483647); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vn(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), fx = x - xi, fy = y - yi, fz = z - zi;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy), w = fz * fz * (3 - 2 * fz);
  const L = (a, b, t) => a + (b - a) * t;
  return L(L(L(hash(xi, yi, zi), hash(xi + 1, yi, zi), u), L(hash(xi, yi + 1, zi), hash(xi + 1, yi + 1, zi), u), v),
           L(L(hash(xi, yi, zi + 1), hash(xi + 1, yi, zi + 1), u), L(hash(xi, yi + 1, zi + 1), hash(xi + 1, yi + 1, zi + 1), u), v), w);
}
const field = (x, y, z) => 0.55 * vn(x * .0036, y * .0036, z) + 0.30 * vn(x * .0085 + 13, y * .0085, z * 1.7) + 0.15 * vn(x * .02, y * .02 + 7, z * 2.6);
// ---------- layers
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const topoC = mk(W, H), topoB = mk(W, H), halfA = mk(W / 4, H / 4), halfB = mk(W / 4, H / 4);
const CELL = 10, NX = Math.ceil(W / CELL) + 1, NY = Math.ceil(H / CELL) + 1, F = new Float32Array(NX * NY);
function topo(t) {
  const z = 3.0 + t * 0.10;
  for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) F[j * NX + i] = field(i * CELL, j * CELL, z);
  const minor = new Path2D(), major = new Path2D();
  for (let k = 0, lv = 0.30; lv < 0.74; lv += 0.024, k++) {
    const P = (k % 5 === 0) ? major : minor;
    for (let j = 0; j < NY - 1; j++) for (let i = 0; i < NX - 1; i++) {
      const a = F[j * NX + i], b = F[j * NX + i + 1], c = F[(j + 1) * NX + i + 1], e = F[(j + 1) * NX + i];
      const idx = (a > lv ? 8 : 0) | (b > lv ? 4 : 0) | (c > lv ? 2 : 0) | (e > lv ? 1 : 0); if (idx === 0 || idx === 15) continue;
      const X = i * CELL, Y = j * CELL, q = (p, r) => (lv - p) / (r - p);
      const T = [X + CELL * q(a, b), Y], R = [X + CELL, Y + CELL * q(b, c)], B = [X + CELL * q(e, c), Y + CELL], Lf = [X, Y + CELL * q(a, e)];
      const s = { 1: [Lf, B], 2: [B, R], 3: [Lf, R], 4: [T, R], 5: [T, Lf, B, R], 6: [T, B], 7: [T, Lf], 8: [T, Lf], 9: [T, B], 10: [T, R, Lf, B], 11: [T, R], 12: [Lf, R], 13: [B, R], 14: [Lf, B] }[idx];
      for (let n = 0; n < s.length; n += 2) { P.moveTo(s[n][0], s[n][1]); P.lineTo(s[n + 1][0], s[n + 1][1]); }
    }
  }
  const draw = (g, a1, a2, col) => { g.clearRect(0, 0, W, H); g.lineJoin = 'round'; g.strokeStyle = `rgba(${col},${a1})`; g.lineWidth = 1.3; g.stroke(minor); g.strokeStyle = `rgba(${col},${a2})`; g.lineWidth = 2.4; g.stroke(major); };
  draw(topoC.getContext('2d'), 0.17, 0.30, KHAKI);
  const g = topoB.getContext('2d'); draw(g, 0.55, 0.95, '255,226,160');
  return g;
}
// ---------- light (the search light)
function lightAt(t) {
  const pts = [[0, 150, 1150, 420], [1.6, 760, 820, 520], [3.0, 540, 470, 640], [4.2, 540, 430, 820], [9, 560, 450, 760]];
  let k = 0; while (k < pts.length - 2 && t > pts[k + 1][0]) k++;
  const a = pts[k], b = pts[k + 1], u = sm(a[0], b[0], t);
  return { x: lerp(a[1], b[1], u) + Math.sin(t * 0.8) * 14, y: lerp(a[2], b[2], u) + Math.cos(t * 0.6) * 10, r: lerp(a[3], b[3], u) * (1 + 0.04 * Math.sin(t * 1.3)) };
}
// ---------- sprites
const bead = (() => { const c = mk(16, 16), g = c.getContext('2d'), r = g.createRadialGradient(6, 5.5, 0.5, 8, 8, 7.5); r.addColorStop(0, '#f6f3e8'); r.addColorStop(0.45, '#a3aaa3'); r.addColorStop(1, '#2f3531'); g.fillStyle = r; g.beginPath(); g.arc(8, 8, 7, 0, TAU); g.fill(); return c; })();
const grainC = (() => { const c = mk(512, 512), g = c.getContext('2d'), d = g.createImageData(512, 512); let s = 5; for (let i = 0; i < d.data.length; i += 4) { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; const v = s >>> 24; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); return c; })();
const DUST = Array.from({ length: 70 }, (_, i) => ({ x: hash(i, 1, 9) * W, y: hash(i, 2, 9) * H, s: 0.8 + hash(i, 3, 9) * 2.2, v: 6 + hash(i, 4, 9) * 22, ph: hash(i, 5, 9) * TAU }));
// ---------- tag
const TW = 250, TH = 470, TR = 58, TS = 1.12;
function tagPath(g, inset = 0) { const x0 = -TW / 2 + inset, x1 = TW / 2 - inset, y0 = -46 + inset, y1 = -46 + TH - inset, r = TR - inset; g.beginPath(); g.moveTo(x0 + r, y0); g.lineTo(x1 - r, y0); g.arcTo(x1, y0, x1, y0 + r, r); g.lineTo(x1, y1 - r); g.arcTo(x1, y1, x1 - r, y1, r); g.lineTo(x0 + r, y1); g.arcTo(x0, y1, x0, y1 - r, r); g.lineTo(x0, y0 + r); g.arcTo(x0, y0, x0 + r, y0, r); g.closePath(); }
function stamp(g, txt, x, y, size, track, wt = 700) { g.font = `${wt} ${size}px Oswald`; g.letterSpacing = track + 'px'; g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = 'rgba(255,255,255,.55)'; g.fillText(txt, x, y + 1.8); g.fillStyle = 'rgba(38,44,40,.88)'; g.fillText(txt, x, y); }
function drawTag(g, t, th, lit) {
  g.save(); g.scale(TS, TS);
  g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 40; g.shadowOffsetY = 26;
  const st = g.createLinearGradient(-TW / 2, -46, TW / 2, TH);
  st.addColorStop(0, '#eef1ea'); st.addColorStop(0.32, '#a8afa9'); st.addColorStop(0.55, '#cfd4cc'); st.addColorStop(1, '#69706b');
  tagPath(g); g.fillStyle = st; g.fill(); g.shadowColor = 'transparent';
  g.save(); tagPath(g); g.clip();
  // light on the metal: brightness follows the search light, plus a moving sheen
  g.fillStyle = `rgba(10,14,10,${0.42 * (1 - lit)})`; g.fillRect(-300, -100, 600, 700);
  const sx = lerp(-260, 260, 0.5 + 0.5 * Math.sin(t * 0.7 + th * 6));
  let sg = g.createLinearGradient(sx - 90, -60, sx + 90, 80 + 40); sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, 'rgba(255,255,255,.34)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sg; g.fillRect(-300, -100, 600, 700);
  const bx = lerp(-420, 420, sm(3.7, 5.0, t));    // the beam passing over the tag as the second phrase lands
  sg = g.createLinearGradient(bx - 110, 0, bx + 110, 60); sg.addColorStop(0, 'rgba(255,230,170,0)'); sg.addColorStop(0.5, 'rgba(255,236,190,.62)'); sg.addColorStop(1, 'rgba(255,230,170,0)');
  if (t > 3.6 && t < 5.2) { g.fillStyle = sg; g.fillRect(-300, -100, 600, 700); }
  // brushed texture
  g.globalAlpha = 0.06; for (let y = -46; y < TH; y += 3) { g.fillStyle = (y / 3 | 0) % 2 ? '#000' : '#fff'; g.fillRect(-TW / 2, y, TW, 1); } g.globalAlpha = 1;
  g.restore();
  // bevel
  tagPath(g, 9); g.strokeStyle = 'rgba(40,46,42,.75)'; g.lineWidth = 3; g.stroke();
  g.save(); g.translate(0, 2); tagPath(g, 9); g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1.4; g.stroke(); g.restore();
  // hole + ring
  g.fillStyle = '#10140f'; g.beginPath(); g.arc(0, 0, 15, 0, TAU); g.fill();
  g.strokeStyle = '#7b837d'; g.lineWidth = 3.4; g.beginPath(); g.arc(0, 0, 17.5, 0, TAU); g.stroke();
  // stamped lettering
  stamp(g, 'ЦПР', 0, 168, 96, 4);
  g.fillStyle = 'rgba(38,44,40,.7)'; g.fillRect(-58, 200, 116, 2.4); g.fillStyle = 'rgba(255,255,255,.5)'; g.fillRect(-58, 202.4, 116, 1.4);
  stamp(g, 'ЦЕНТР', 0, 252, 31, 7, 500); stamp(g, 'ПОИСКОВЫХ', 0, 296, 31, 7, 500); stamp(g, 'РЕШЕНИЙ', 0, 340, 31, 7, 500);
  g.restore();
}
// ---------- kinetic type
function words(t, spec) {      // spec: {words:[w..], y, size, color, glow, t0, per, weight}
  ctx.save(); ctx.font = `${spec.weight || 700} ${spec.size}px Oswald`; ctx.letterSpacing = (spec.track || 0) + 'px'; ctx.textBaseline = 'alphabetic';
  const sp = spec.size * 0.26, ws = spec.words.map((w) => ctx.measureText(w).width); const total = ws.reduce((a, b) => a + b, 0) + sp * (ws.length - 1);
  let x = W / 2 - total / 2;
  spec.words.forEach((w, i) => {
    const k = eo5((t - spec.t0 - i * spec.per) / 0.95);
    if (k > 0) {
      ctx.save(); ctx.beginPath(); ctx.rect(x - 20, spec.y - spec.size * 1.02, ws[i] + 40, spec.size * 1.22); ctx.clip();
      const dy = (1 - k) * spec.size * 0.95; ctx.globalAlpha = clamp(k * 2.2); ctx.textAlign = 'left';
      if (spec.glow) { ctx.shadowColor = spec.glow; ctx.shadowBlur = 36 * k; }
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillText(w, x + 0, spec.y + dy + 6);
      ctx.fillStyle = spec.color; ctx.fillText(w, x, spec.y + dy); ctx.restore();
    }
    x += ws[i] + sp;
  });
  ctx.restore();
}
// ---------- frame
function drawFrame(i) {
  const t = i / FPS, g = ctx;
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#0e130d'); bg.addColorStop(1, '#0a0e09'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const L = lightAt(t), lg = topo(t);
  g.drawImage(topoC, 0, 0);
  // bright contours only inside the search light
  lg.globalCompositeOperation = 'destination-in'; const m = lg.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r); m.addColorStop(0, 'rgba(0,0,0,1)'); m.addColorStop(0.55, 'rgba(0,0,0,.45)'); m.addColorStop(1, 'rgba(0,0,0,0)'); lg.fillStyle = m; lg.fillRect(0, 0, W, H); lg.globalCompositeOperation = 'source-over';
  g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.9; g.drawImage(topoB, 0, 0);
  const wg = g.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r * 1.1); wg.addColorStop(0, 'rgba(255,205,130,.20)'); wg.addColorStop(0.5, 'rgba(210,160,90,.07)'); wg.addColorStop(1, 'rgba(210,160,90,0)'); g.globalAlpha = 1; g.fillStyle = wg; g.fillRect(0, 0, W, H); g.restore();
  // shake on arrival
  const tk = t - 1.35, sh = tk > 0 && tk < 0.6 ? Math.exp(-tk * 7) * 7 : 0; g.save(); g.translate(Math.sin(tk * 90) * sh * 0.5, Math.cos(tk * 70) * sh);
  // tag + chain (pendulum about a pivot above the frame)
  const drop = -560 * (1 - eo3(t / 1.35)), Lc = 205, ta = t - 1.35;
  const th = (ta > 0 ? 0.15 * Math.exp(-ta / 2.0) * Math.sin(TAU * ta / 2.7) : 0) + 0.011 * Math.sin(t * 0.9) * sm(2, 4, t);
  g.save(); g.translate(540, -70 + drop); g.rotate(th);
  for (let y = -900; y < Lc; y += 12.5) g.drawImage(bead, -5.5, y - 5.5, 11, 11);
  g.translate(0, Lc); drawTag(g, t, th, clamp(0.55 + 0.45 * sm(1.5, 3.2, t))); g.restore();
  g.restore();
  // dust drifting through the light
  g.save(); g.globalCompositeOperation = 'lighter';
  for (const d of DUST) { const x = (d.x + Math.sin(t * 0.3 + d.ph) * 24 + t * d.v * 0.2) % W, y = ((d.y - t * d.v) % H + H) % H, dd = Math.hypot(x - L.x, y - L.y), a = (0.10 + 0.55 * clamp(1 - dd / L.r)) * (0.6 + 0.4 * Math.sin(t * 1.7 + d.ph)); g.fillStyle = `rgba(${GOLD},${a * 0.8})`; g.beginPath(); g.arc(x, y, d.s, 0, TAU); g.fill(); }
  g.restore();
  // type
  words(t, { words: ['ВАС', 'ЖДУТ.'], y: 872, size: 158, color: `rgb(${SAND})`, t0: 2.1, per: 0.14, track: 2 });
  words(t, { words: ['МЫ', 'ИЩЕМ.'], y: 1036, size: 158, color: `rgb(${GOLD})`, glow: 'rgba(255,170,70,.55)', t0: 3.45, per: 0.14, track: 2 });
  // beam sweeping across the type
  if (t > 3.6 && t < 5.2) { const bx = lerp(-300, W + 300, sm(3.6, 5.1, t)); const bg2 = g.createLinearGradient(bx - 240, 0, bx + 240, 0); bg2.addColorStop(0, 'rgba(255,220,150,0)'); bg2.addColorStop(0.5, 'rgba(255,226,170,.24)'); bg2.addColorStop(1, 'rgba(255,220,150,0)'); g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = bg2; g.fillRect(0, 760, W, 330); g.restore(); }
  // signature
  const rk = eo3((t - 5.4) / 1.0), fk = sm(5.8, 6.8, t);
  if (rk > 0) { g.save(); g.strokeStyle = `rgba(${KHAKI},.85)`; g.lineWidth = 2; g.beginPath(); g.moveTo(540 - 150 * rk, 1150); g.lineTo(540 + 150 * rk, 1150); g.stroke(); g.restore(); }
  if (fk > 0) { g.save(); g.globalAlpha = fk; g.font = '600 25px Oswald'; g.letterSpacing = '9px'; g.textAlign = 'center'; g.fillStyle = `rgb(${SAND})`; g.fillText('ЦЕНТР ПОИСКОВЫХ РЕШЕНИЙ', 540 + 4, 1208 + (1 - fk) * 10); g.restore(); }
  // corner marks
  g.save(); g.strokeStyle = `rgba(${KHAKI},${0.55 * sm(0.2, 1.2, t)})`; g.lineWidth = 2; for (const [x, y, sx, sy] of [[48, 48, 1, 1], [W - 48, 48, -1, 1], [48, H - 48, 1, -1], [W - 48, H - 48, -1, -1]]) { g.beginPath(); g.moveTo(x, y + sy * 34); g.lineTo(x, y); g.lineTo(x + sx * 34, y); g.stroke(); } g.restore();
  // bloom
  const a = halfA.getContext('2d'), b = halfB.getContext('2d');
  a.globalCompositeOperation = 'copy'; a.filter = 'brightness(.92) contrast(1.45)'; a.drawImage(cv, 0, 0, W / 4, H / 4); a.filter = 'none';
  b.globalCompositeOperation = 'copy'; b.filter = 'blur(9px)'; b.drawImage(halfA, 0, 0); b.filter = 'none';
  g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.42; g.drawImage(halfB, 0, 0, W, H); g.restore();
  // vignette + grain + fade-in
  const v = g.createRadialGradient(W / 2, H * 0.46, 330, W / 2, H * 0.46, 920); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.62)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
  g.save(); g.globalCompositeOperation = 'overlay'; g.globalAlpha = 0.11; const ox = (hash(i, 7, 7) * 512) | 0, oy = (hash(i, 8, 7) * 512) | 0; for (let y = -oy; y < H; y += 512) for (let x = -ox; x < W; x += 512) g.drawImage(grainC, x, y); g.restore();
  const fi = 1 - sm(0, 0.5, t); if (fi > 0) { g.fillStyle = `rgba(0,0,0,${fi})`; g.fillRect(0, 0, W, H); }
}
window.READY = false; window.frame = (i, q) => { drawFrame(i); return cv.toDataURL('image/jpeg', q || 0.95); };
Promise.all([document.fonts.load('700 40px Oswald', 'ЦПР ВАС ЖДУТ'), document.fonts.load('500 30px Oswald', 'ЦЕНТР ПОИСКОВЫХ'), document.fonts.load('600 25px Oswald', 'ЦЕНТР')]).then(() => { window.READY = true; });
</script></body></html>
