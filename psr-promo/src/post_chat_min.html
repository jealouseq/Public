<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>ЦПР — пост «Мы ищем ответ» (минимал)</title>
<link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/fonts/post.css"><link rel="stylesheet" href="/fonts/post2.css">
<style>
:root{--ink:#0a0d0b;--sand:#f3ecd8;--gold:#efc16a;--mute:#808b74;--m:72px}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--ink);color:var(--sand);font-family:Manrope,sans-serif}
.bg{position:absolute;inset:0;background:radial-gradient(620px 470px at 70% 51%,rgba(239,193,106,.20),transparent 72%),linear-gradient(180deg,#0c100d,#080a08)}
.hdr{position:absolute;left:var(--m);right:var(--m);top:56px;display:flex;align-items:center;gap:22px;padding-bottom:30px;border-bottom:1.5px solid rgba(128,139,116,.28)}
.av{width:72px;height:72px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(128,139,116,.5);display:grid;place-items:center}
.av svg{width:40px;height:40px;fill:none;stroke:var(--mute);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1 7.5}
.hdr b{display:block;font:700 32px Manrope}.hdr small{display:block;font:500 25px Manrope;color:var(--mute);margin-top:4px}
.day{position:absolute;left:var(--m);right:var(--m);display:flex;align-items:center;gap:22px;font:600 22px Manrope;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.day:before,.day:after{content:"";flex:1;height:1.5px;background:rgba(128,139,116,.22)}
.msg{position:absolute;right:var(--m);transform-origin:100% 50%}
.bub{position:relative;display:inline-block;padding:22px 32px 18px;border-radius:30px 30px 7px 30px;background:#1a211a;color:#d7dccb;font:500 52px/1.12 Manrope;letter-spacing:-.012em}
.bub:after{content:"";position:absolute;right:-11px;bottom:0;width:22px;height:24px;background:#1a211a;clip-path:path('M0 0V24H22C9 22 3 13 0 0Z')}
.bub .m{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:6px;font:500 24px Manrope;color:rgba(215,220,203,.55)}
.bub svg{width:30px;height:22px;fill:none;stroke:rgba(215,220,203,.55);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.last{background:linear-gradient(160deg,#4f6f3c,#35502a);color:#f7f0dc;font-size:78px;padding:26px 38px 22px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.last:after{background:#35502a;right:-13px;width:26px;height:28px;clip-path:path('M0 0V28H26C11 26 3 15 0 0Z')}
.last .m{font-size:28px;color:rgba(255,240,205,.85)}.last svg{stroke:var(--gold);width:38px;height:28px}
h1{position:absolute;left:var(--m);top:884px;margin-left:-8px;font:600 178px/.92 'Cormorant Garamond',serif;letter-spacing:-.04em;color:#f8f1de}
h1 span{display:block;white-space:nowrap}h1 .g{color:var(--gold);font-weight:700}
.kick{position:absolute;left:var(--m);top:846px;display:flex;align-items:center;gap:18px;font:600 26px Oswald;letter-spacing:.28em;color:var(--gold)}
.kick i{display:block;width:54px;height:2px;background:var(--gold)}
.foot{position:absolute;left:var(--m);right:var(--m);bottom:56px;display:flex;justify-content:space-between;font:600 20px Oswald;letter-spacing:.22em;color:#b9c2ac}
.foot span:last-child{color:var(--mute);font-weight:500}
.grain{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.18;pointer-events:none}
</style></head>
<body><div class="post" id="post">
<div class="bg"></div>
<div class="hdr"><div class="av"><svg viewBox="0 0 44 44"><circle cx="22" cy="16" r="8"/><path d="M6 40c2-10 10-14 16-14s14 4 16 14"/></svg></div><div><b>Не в сети</b><small>был(а) давно</small></div></div>

<div class="day" style="top:196px;opacity:.5">3-й день</div>
<div class="msg" style="top:244px;transform:scale(.6);opacity:.45"><div class="bub">Ты как?<div class="m">09:41 <svg viewBox="0 0 30 22"><path d="M3 12l7 7L25 3"/></svg></div></div></div>

<div class="day" style="top:372px;opacity:.75">10-й день</div>
<div class="msg" style="top:420px;transform:scale(.8);opacity:.78"><div class="bub">Напиши, как сможешь<div class="m">21:15 <svg viewBox="0 0 30 22"><path d="M3 12l7 7L25 3"/></svg></div></div></div>

<div class="day" style="top:562px">21-й день</div>
<div class="msg" style="top:614px"><div class="bub last">Мы ждём тебя<div class="m">23:58 <svg viewBox="0 0 30 22"><path d="M3 12l7 7L25 3"/></svg></div></div></div>

<div class="kick"><i></i>КОГДА В ЧАТЕ — ОДНА ГАЛОЧКА</div>
<h1><span>Мы ищем</span><span class="g">ответ.</span></h1>
<div class="foot"><span>ЦЕНТР ПОИСКОВЫХ РЕШЕНИЙ</span><span>РОЗЫСК В ЗОНЕ СВО</span></div>
<svg class="grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="11"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.3 -.3"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div></body></html>
