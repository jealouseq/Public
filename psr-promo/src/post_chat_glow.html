<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>ЦПР — пост «Мы ищем ответ» (свет)</title>
<link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/fonts/post.css"><link rel="stylesheet" href="/fonts/post2.css">
<style>
:root{--ink:#080b09;--sand:#efe6cf;--gold:#f2c46f;--mute:#8d987f;--lx:732px;--ly:714px}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--ink);color:var(--sand);font-family:Manrope,sans-serif}
.bg{position:absolute;inset:0;background:radial-gradient(800px 600px at 0% 0%,rgba(40,58,34,.34),transparent 70%),linear-gradient(180deg,#0a0e0b,#070908)}
/* ---- light: one source (the last bubble), inverse-square-like falloff, screen-blended under the content */
.L{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none}
.L1{background:radial-gradient(ellipse 330px 190px at var(--lx) var(--ly),rgba(206,232,130,.30) 0%,rgba(206,232,130,.13) 35%,rgba(206,232,130,.04) 70%,transparent 100%)}
.L2{background:radial-gradient(ellipse 620px 420px at var(--lx) var(--ly),rgba(242,196,111,.27) 0%,rgba(242,196,111,.12) 30%,rgba(242,196,111,.035) 62%,transparent 100%)}
.L3{background:radial-gradient(ellipse 1100px 800px at var(--lx) var(--ly),rgba(242,196,111,.07) 0%,rgba(242,196,111,.025) 55%,transparent 100%)}
/* light that lands ON the content near the source */
.Ltop{position:absolute;inset:0;mix-blend-mode:soft-light;pointer-events:none;background:radial-gradient(ellipse 560px 380px at var(--lx) var(--ly),rgba(255,236,190,.55),transparent 100%)}
.hdr{position:absolute;left:64px;right:64px;top:54px;display:flex;align-items:center;gap:22px;padding-bottom:22px;border-bottom:1.5px solid rgba(141,152,127,.28)}
.av{width:78px;height:78px;border-radius:50%;background:#131912;box-shadow:inset 0 0 0 2px rgba(141,152,127,.45);display:grid;place-items:center}
.av svg{width:44px;height:44px;fill:none;stroke:var(--mute);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1 7}
.hdr b{display:block;font:700 32px Manrope}.hdr small{display:block;font:500 25px Manrope;color:var(--mute);margin-top:4px}
.pill{position:absolute;left:50%;padding:10px 26px;border-radius:30px;background:rgba(141,152,127,.15);font:600 25px Manrope;letter-spacing:.04em;color:#c4cdb8;white-space:nowrap;transform:translateX(-50%)}
.msg{position:absolute;right:64px;transform-origin:100% 50%}
.bub{position:relative;display:inline-block;background:linear-gradient(165deg,#34462b,#27351f);color:#d9dfcd;padding:22px 30px 20px;border-radius:30px 30px 7px 30px;font:500 52px/1.12 Manrope;letter-spacing:-.012em;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.08)}
.bub:after{content:"";position:absolute;right:-12px;bottom:0;width:24px;height:26px;background:#27351f;clip-path:path('M0 0V26H24C10 24 3 14 0 0Z')}
.bub .m{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:8px;font:500 24px Manrope;color:rgba(239,230,207,.58)}
.bub svg{width:30px;height:22px;fill:none;stroke:rgba(239,230,207,.58);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
/* neighbours catch the bounce light on their lower edge */
.bounce:before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(0deg,rgba(242,196,111,.20),transparent 62%);pointer-events:none}
.last{background:linear-gradient(160deg,#5b8044,#3b5a2d);color:#f8f1dc;font-size:80px;padding:26px 36px 22px;
 box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -26px 50px rgba(20,40,10,.25),
  0 0 36px rgba(170,215,110,.26),0 0 100px rgba(206,226,120,.22)}
.last:after{background:#3b5a2d;right:-14px;width:26px;height:28px;clip-path:path('M0 0V28H26C11 26 3 15 0 0Z')}
.last .m{font-size:28px;color:rgba(255,244,214,.92)}.last svg{stroke:#ffdc94;width:38px;height:28px;filter:drop-shadow(0 0 7px rgba(255,200,110,.9))}
.last .t{text-shadow:0 0 30px rgba(255,244,200,.25)}
.kick{position:absolute;left:64px;top:848px;display:flex;align-items:center;gap:18px;font:600 26px Oswald;letter-spacing:.28em;color:var(--gold);text-shadow:0 0 16px rgba(242,196,111,.45)}
.kick i{display:block;width:54px;height:2px;background:var(--gold);box-shadow:0 0 12px rgba(242,196,111,.7)}
h1{position:absolute;left:52px;top:888px;font:600 196px/.9 'Cormorant Garamond',serif;letter-spacing:-.04em;color:#f8f1de;text-shadow:0 0 70px rgba(255,236,190,.10)}
h1 span{display:block;white-space:nowrap}
h1 .g{color:var(--gold);margin-left:236px;font-weight:700;text-shadow:0 0 34px rgba(242,196,111,.40),0 0 96px rgba(242,196,111,.22)}
.grain{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.22;pointer-events:none}
.vig{position:absolute;inset:0;background:radial-gradient(130% 105% at 50% 45%,transparent 60%,rgba(0,0,0,.5))}
</style></head>
<body><div class="post" id="post">
<div class="bg"></div>
<div class="L L3"></div><div class="L L2"></div><div class="L L1"></div>
<div class="hdr"><div class="av"><svg viewBox="0 0 44 44"><circle cx="22" cy="16" r="8"/><path d="M6 40c2-10 10-14 16-14s14 4 16 14"/></svg></div><div><b>Не в сети</b><small>был(а) давно</small></div></div>

<div class="pill" style="top:186px;transform:translateX(-50%) scale(.8);opacity:.42">3-й день</div>
<div class="msg" style="top:236px;transform:scale(.6);opacity:.42"><div class="bub">Ты как?<div class="m">09:41 <svg viewBox="0 0 30 22"><path d="M3 12l7 7L25 3"/></svg></div></div></div>

<div class="pill" style="top:368px;transform:translateX(-50%) scale(.9);opacity:.7">10-й день</div>
<div class="msg" style="top:410px;transform:scale(.8);opacity:.8"><div class="bub bounce">Напиши, как сможешь<div class="m">21:15 <svg viewBox="0 0 30 22"><path d="M3 12l7 7L25 3"/></svg></div></div></div>

<div class="pill" style="top:548px;background:rgba(242,196,111,.16);color:#e7dcc0">21-й день</div>
<div class="msg" style="top:604px"><div class="bub last"><span class="t">Мы ждём тебя</span><div class="m">23:58 <svg viewBox="0 0 30 22"><path d="M3 12l7 7L25 3"/></svg></div></div></div>

<div class="kick"><i></i>КОГДА В ЧАТЕ — ОДНА ГАЛОЧКА</div>
<h1><span>Мы ищем</span><span class="g">ответ.</span></h1>
<div class="Ltop"></div>
<div class="vig"></div>
<svg class="grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="11"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.3 -.3"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div></body></html>
