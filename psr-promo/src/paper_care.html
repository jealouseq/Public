.tex{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.5;pointer-events:none}

.top{z-index:5;color:#e8e0c6;border-bottom-color:rgba(232,224,198,.55)}.top span:last-child{color:#f2c46f}
