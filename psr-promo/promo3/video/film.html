<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>ЦПР — ролик</title>
<link rel="stylesheet" href="/promo3/fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{background:#000;overflow:hidden}
#stage{position:relative;overflow:hidden;background:#000;color:#f4efe4}
#photos{position:absolute;inset:0;filter:url(#grade)}
.shot{position:absolute;inset:0;overflow:hidden;opacity:0}
.cam{position:absolute;will-change:transform,filter}
.cam img{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.cam img.glow{mix-blend-mode:screen;opacity:.34}
.scrim{position:absolute;inset:0;pointer-events:none}
/* --- phone screen UI (drawn in 390x900 units, mapped onto the photographed screen) --- */
.ui{position:absolute;left:0;top:0;transform-origin:0 0;font-family:'Onest',sans-serif;color:#04202d}
.ui.mul{mix-blend-mode:multiply}
.ui.gl{mix-blend-mode:screen;pointer-events:none;background:linear-gradient(112deg,transparent 28%,rgba(255,255,255,.26) 40%,transparent 52%);background-size:260% 100%}
.ui .sb{position:absolute;left:30px;top:12px;font:600 16px 'Onest';letter-spacing:.02em}
.ui .sbr{position:absolute;right:28px;top:14px;display:flex;gap:7px;align-items:center}
.ui .sbr i{display:block;width:5px;border-radius:1px;background:#04202d}
.ui .bat{width:26px;height:12px;border:2px solid #04202d;border-radius:4px;position:relative}.ui .bat:after{content:"";position:absolute;left:2px;top:2px;bottom:2px;width:14px;background:#04202d;border-radius:1px}
.ui .hdr{position:absolute;left:-12px;right:-12px;top:44px;height:80px;background:rgba(15,60,85,.2);border-bottom:1.5px solid rgba(4,32,45,.3)}
.ui .av{position:absolute;left:32px;top:16px;width:48px;height:48px;border-radius:50%;background:rgba(4,32,45,.28)}
.ui .av:before{content:"";position:absolute;left:15px;top:9px;width:18px;height:18px;border-radius:50%;background:rgba(4,32,45,.55)}
.ui .av:after{content:"";position:absolute;left:8px;top:30px;width:32px;height:20px;border-radius:16px 16px 0 0;background:rgba(4,32,45,.55)}
.ui .nm{position:absolute;left:94px;top:12px;font:700 26px 'Onest'}
.ui .ls{position:absolute;left:94px;top:46px;font:500 19px 'Onest';opacity:.78}
.ui .msgs{position:absolute;left:0;right:0;top:122px;height:666px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent 0,transparent 78px,#000 190px);mask-image:linear-gradient(180deg,transparent 0,transparent 78px,#000 190px)}
.ui .chip{position:absolute;left:143px;top:0;transform:translateX(-50%);padding:6px 18px;border-radius:18px;background:rgba(15,60,85,.2);font:600 24px 'Onest';white-space:nowrap;opacity:0}
.ui .bb{position:absolute;right:134px;max-width:226px;padding:12px 18px 8px;border-radius:24px 24px 5px 24px;background:#66b7c6;font:500 29px/1.2 'Onest';letter-spacing:-.01em;opacity:0;transform-origin:100% 100%}
.ui .bb .m{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:2px;font:500 19px 'Onest';opacity:.82}
.ui .bb svg{width:22px;height:16px;fill:none;stroke:#04202d;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ui .bb svg path{stroke-dasharray:40;stroke-dashoffset:40}
.ui .inp{position:absolute;left:18px;right:18px;top:790px;height:68px;border-radius:34px;border:2.5px solid #0f3249;background:rgba(255,255,255,.5)}
.ui .inp .tt{position:absolute;left:24px;top:0;font:500 23px/63px 'Onest';color:#04202d;white-space:nowrap}
.ui .inp .ph{position:absolute;left:36px;top:0;font:400 23px/63px 'Onest';color:rgba(4,32,45,.55);white-space:nowrap}
.ui .inp .cr{position:absolute;top:17px;width:2.5px;height:29px;background:#04202d}
.ui .snd{position:absolute;right:6px;top:6px;width:48px;height:48px;border-radius:50%;background:#0f3249}
.ui .snd svg{position:absolute;left:11px;top:12px;width:26px;height:24px}
#leak{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none;opacity:0;background:radial-gradient(90% 75% at 88% 12%,rgba(255,176,86,.95),rgba(255,122,58,.38) 46%,transparent 72%)}
#warm{position:absolute;inset:0;mix-blend-mode:soft-light;background:radial-gradient(120% 90% at 70% 20%,rgba(255,196,120,.32),rgba(255,160,90,.08) 60%,transparent);pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(125% 105% at 50% 46%,transparent 56%,rgba(0,0,0,.46));pointer-events:none}
#grain{position:absolute;inset:-60px;background:url(/promo3/video/grain.png);background-size:256px 256px;mix-blend-mode:overlay;opacity:.2;pointer-events:none}
#black{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.tx{position:absolute;pointer-events:none}
.ln{padding:.06em 0 .1em;margin-bottom:-.04em;white-space:nowrap}.ln span{display:inline-block;will-change:transform,opacity,filter}
.ln.mask{overflow:hidden;display:block}.ln.mask span{display:block}
.pr{font-family:'Prata';font-weight:400;letter-spacing:-.01em;line-height:1.1;color:#f7f2e7;text-shadow:0 3px 26px rgba(0,0,0,.5)}
.sm{font-family:'Onest';font-weight:600;letter-spacing:.16em;color:#f0b54a;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.7),0 2px 16px rgba(0,0,0,.8)}
.draft{position:absolute;white-space:nowrap;font-family:'Prata';font-weight:400;letter-spacing:-.005em;color:#f7f2e7;text-shadow:0 2px 24px rgba(0,0,0,.6);display:none}
.draft .cur{display:inline-block;width:.07em;height:.95em;margin-left:.06em;vertical-align:-.12em;background:#f0b54a;box-shadow:0 0 14px rgba(240,181,74,.6)}
.draft .ck{display:inline-block;margin-left:.45em;vertical-align:-.02em;width:.62em;height:.46em;opacity:0}
#end{position:absolute;inset:0;opacity:0}
#end>*{position:absolute}
#end .col{display:flex;flex-direction:column;align-items:flex-start}
#end .mk{position:relative}
#end .mk{color:#f0b54a;display:grid;place-items:center;font:700 40px 'Onest';letter-spacing:.06em}
#end .mk svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#end .cta{font:400 40px/1.28 'Prata';color:#f4eddc}
#end .ct{font:700 40px 'Onest';letter-spacing:.01em;color:#f0b54a}
#end .rule{height:2.5px;background:#f0b54a;transform-origin:0 50%}
#end .fine{font:400 25px 'Onest';color:rgba(244,237,220,.85)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><filter id="grade" color-interpolation-filters="sRGB"><feComponentTransfer>
<feFuncR type="table" tableValues="0.018 0.085 0.30 0.62 0.915 0.985"/><feFuncG type="table" tableValues="0.016 0.075 0.285 0.605 0.9 0.97"/><feFuncB type="table" tableValues="0.03 0.095 0.285 0.57 0.84 0.925"/></feComponentTransfer></filter></defs></svg>
<div id="stage"><div id="photos"></div><div id="warm"></div><div id="leak"></div><div id="texts"></div><div id="end"></div><div id="vig"></div><div id="grain"></div><div id="black"></div></div>
<script src="/promo3/video/tl.js"></script>
<script>
'use strict';
const Q=new URLSearchParams(location.search),W=+Q.get('w')||1080,H=+Q.get('h')||1080,U=W/1080;
const stage=document.getElementById('stage');stage.style.width=W+'px';stage.style.height=H+'px';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),sm=x=>{x=clamp(x);return x*x*(3-2*x)},eo3=x=>1-Math.pow(1-clamp(x),3),lerp=(a,b,t)=>a+(b-a)*t,ease=x=>{x=clamp(x);return .45*x+.55*(x*x*(3-2*x))},ei=x=>{x=clamp(x);return x*x*x*(x*(x*6-15)+10)},eob=x=>{x=clamp(x);const c=1.5;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const {SHOTS,DRAFTS,TEXTS,END_T,T_END,LEAKS,MSGS,CHIPS,TIMES,KEYS}=TL;
const photos=document.getElementById('photos'),texts=document.getElementById('texts');
function homography(src,dst){const A=[],b=[];for(let i=0;i<4;i++){const [x,y]=src[i],[u,v]=dst[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v)}
 const n=8;for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];[b[c],b[p]]=[b[p],b[c]];for(let r=c+1;r<n;r++){const f=A[r][c]/A[c][c];for(let k=c;k<n;k++)A[r][k]-=f*A[c][k];b[r]-=f*b[c]}}
 const x=Array(n).fill(0);for(let r=n-1;r>=0;r--){let s=b[r];for(let k=r+1;k<n;k++)s-=A[r][k]*x[k];x[r]=s/A[r][r]}return x}
const UW=390,UH=900,QUAD=[[637,1206],[981,1142],[1254,1921],[889,1979]];
const TICK='<svg viewBox="0 0 34 25"><path d="M4 13l8 8L30 4"/></svg>';
const PLANE='<svg viewBox="0 0 26 24"><path d="M2 12L24 2l-5 20-6-7-4 5-1-8z" fill="#fff"/></svg>';
const GAP=14,ANCH=648,sc2=x=>{x=clamp(x);return .5*(sm(x)+eo3(x))};   // chat is anchored just above the input; older messages scroll up under the header
// ---- shots
SHOTS.forEach((s,i)=>{const d=document.createElement('div');d.className='shot';d.style.zIndex=i;const cam=document.createElement('div');cam.className='cam';
 const im=new Image();im.src='/promo3/video/photos/'+s.img+'.jpg';cam.appendChild(im);
 if(!s.blur&&!s.noGlow){const gl=new Image();gl.src=im.src;gl.className='glow';gl.style.filter=`blur(${26*U}px) brightness(1.55) contrast(1.6)`;cam.appendChild(gl);s.glowEl=gl}
 if(s.ui){const u=document.createElement('div');u.className='ui mul';u.style.width=UW+'px';u.style.height=UH+'px';
  u.innerHTML=`<div class="sb">21:07</div><div class="sbr"><i style="height:6px"></i><i style="height:9px"></i><i style="height:12px"></i><i style="height:15px"></i><div class="bat"></div></div>
  <div class="hdr"><div class="av"></div><div class="nm">не в сети</div><div class="ls">был(а) давно</div></div>`+
  `<div class="msgs">`+MSGS.map((m,k)=>`<div class="chip">${CHIPS[k].text}</div><div class="bb">${k===2?'Всё хорошо.<br>Мы ждём.':['Ты как?','Напиши, как сможешь'][k]}<div class="m">${TIMES[k]} ${TICK}</div></div>`).join('')+`</div>`+
  `<div class="inp"><span class="ph">Сообщение</span><span class="tt"></span><span class="cr"></span><div class="snd">${PLANE}</div></div>`;
  cam.appendChild(u);s.uiEl=u;s.chipEls=[...u.querySelectorAll('.chip')];s.bubEls=[...u.querySelectorAll('.bb')];s.uiTT=u.querySelector('.tt');s.uiCR=u.querySelector('.cr');s.uiPH=u.querySelector('.ph');
  s.itemsDef=[];MSGS.forEach((m,k)=>{s.itemsDef.push({k,kind:'chip',ta:CHIPS[k].t,el:s.chipEls[k]},{k,kind:'bub',ta:m.sentAt,el:s.bubEls[k]})});
  const cut=new Image();cut.src='/promo3/video/photos/p_phone_cut.png';cut.className='cut';cam.appendChild(cut);s.cutIm=cut;   // finger, notch and bezel sit ON TOP of the interface
  s.hdrEls=[...u.querySelectorAll('.sb,.sbr,.hdr')]}
 d.appendChild(cam);photos.appendChild(d);s.el=d;s.camEl=cam;s.im=im;s.next=SHOTS[i+1];
 const sc=document.createElement('div');sc.className='scrim';sc.style.background=`linear-gradient(180deg,rgba(0,0,0,.34) 0,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 38%,rgba(0,0,0,${s.scrim*(s.scrimMid||.4)}) 62%,rgba(0,0,0,${s.scrim}) 100%)`;d.appendChild(sc);s.sc=sc});
function layout(s){const nw=s.im.naturalWidth,nh=s.im.naturalHeight,k=Math.max(W/nw,H/nh),cw=nw*k,ch=nh*k,cl=(W-cw)/2,ct=(H-ch)*s.oy/100;Object.assign(s,{k,cw,ch,cl,ct,nw,nh});
 Object.assign(s.camEl.style,{left:cl+'px',top:ct+'px',width:cw+'px',height:ch+'px'});
 if(s.ui){const kk=nw/2001,dst=QUAD.map(p=>[p[0]*kk*k,p[1]*kk*k]),h=homography([[0,0],[UW,0],[UW,UH],[0,UH]],dst);
  const m=`matrix3d(${h[0]},${h[3]},0,${h[6]},${h[1]},${h[4]},0,${h[7]},0,0,1,0,${h[2]},${h[5]},0,1)`;s.uiEl.style.transform=m;s.itemsDef.forEach(it=>{it.h=it.el.offsetHeight});
  const f=(ux,uy)=>{const w=h[6]*ux+h[7]*uy+1;return[(h[0]*ux+h[1]*uy+h[2])/w+cl,(h[3]*ux+h[4]*uy+h[5])/w+ct]};
  const c=s.cam.focus;if(c){s.focusPs=c.ui.map(u=>{const p=f(u[0]*UW,u[1]*UH);return[p[0]/W,p[1]/H]})}}}
// ---- typed draft over the hands (Prata)
const CK='<svg viewBox="0 0 34 25" fill="none" stroke="#f0b54a" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" style="overflow:visible;width:100%;height:100%"><path d="M4 13l8 8L30 4"/></svg>';
const LH=84*U,FS=66*U;
DRAFTS.forEach(d=>d.rows.forEach((r,i)=>{const e=document.createElement('div');e.className='draft';e.style.left=72*U+'px';e.style.top=(d.top*H+i*LH)+'px';e.style.fontSize=FS+'px';e.innerHTML='<span class="t"></span><span class="cur"></span><span class="ck">'+CK+'</span>';texts.appendChild(e);r.el=e;r.t=e.querySelector('.t');r.cur=e.querySelector('.cur');r.ck=e.querySelector('.ck')}));
// ---- set phrases
TEXTS.forEach(t=>{const d=document.createElement('div');d.className='tx pr';d.style.left=72*U+'px';d.style.top=t.top*H+'px';d.style.fontSize=t.size*U+'px';
 t.lns=t.lines.map(l=>{const w=document.createElement('div');w.className='ln'+(t.anim==='rise'?' mask':'');
  if(t.anim==='words'){t.words=t.words||[];l.split(' ').forEach((wd,k,arr)=>{const sp=document.createElement('span');sp.textContent=wd+(k<arr.length-1?' ':'');w.appendChild(sp);t.words.push(sp)});d.appendChild(w);return w}
  const sp=document.createElement('span');sp.textContent=l;w.appendChild(sp);d.appendChild(w);return sp});
 if(t.sub){const s=document.createElement('div');s.className='sm';s.style.fontSize=34*U+'px';s.style.fontWeight='700';s.style.marginTop=22*U+'px';s.textContent=t.sub;d.appendChild(s);t.subEl=s}
 texts.appendChild(d);t.el=d;
 if(t.anim==='sweep'){t.lns.forEach(sp=>{sp.style.backgroundImage='linear-gradient(100deg,#f1e8d6 0%,#f1e8d6 42%,#ffffff 50%,#f1e8d6 58%,#f1e8d6 100%)';sp.style.backgroundSize='260% 100%';sp.style.webkitBackgroundClip='text';sp.style.backgroundClip='text';sp.style.webkitTextFillColor='transparent';sp.style.textShadow='none'});d.style.textShadow='none';d.style.filter='drop-shadow(0 3px 20px rgba(0,0,0,.55))'}});
// ---- brand + end card
const end=document.getElementById('end');
end.innerHTML=`<div class="col" style="left:${72*U}px;top:${H*.2}px;width:${936*U}px">
<div class="mk" style="width:${120*U}px;height:${120*U}px"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="62" fill="none" stroke="#f0b54a" stroke-width="4" stroke-dasharray="392" stroke-dashoffset="392" stroke-linecap="round" opacity="0"/></svg><span style="opacity:0;font-size:${36*U}px">ЦПР</span></div>
<div class="pr" style="margin-top:${36*U}px;font-size:${68*U}px;line-height:1.14">Центр<br>поисковых решений</div>
<div class="pr" style="margin-top:${26*U}px;font:500 ${32*U}px/1.4 Onest;color:#d9d2c0;text-shadow:none">Профессиональный розыск<br>пропавших бойцов в зоне СВО</div>
<div class="rule" style="margin-top:${40*U}px;width:${200*U}px"></div>
<div class="cta" style="margin-top:${32*U}px;font-size:${40*U}px">Напишите нам — ответим<br>и подскажем, с чего начать</div>
<div class="ct" style="margin-top:${30*U}px;font-size:${40*U}px">Контакты — в описании канала</div></div>
<div class="fine" style="left:${72*U}px;bottom:${48*U}px;font-size:${24*U}px">Сюжет вымышлен, кадры иллюстративные.</div>`;
const col=end.querySelector('.col'),E=[...col.children,end.querySelector('.fine')],ring=end.querySelector('circle'),ringTxt=end.querySelector('.mk span'),rule=E[3];
const black=document.getElementById('black'),grain=document.getElementById('grain'),warm=document.getElementById('warm'),leak=document.getElementById('leak');
const RGB='247,242,231';
function focus(el,f,rad){f=clamp(f);const c=f*f*(3-2*f);el.style.color=`rgba(${RGB},${c})`;el.style.textShadow=`0 0 ${(1-f)*rad}px rgba(${RGB},${(1-c)*.95}),0 3px 26px rgba(0,0,0,${.5*c})`}
function hh(t,seed,amp){const a=amp*U;return [a*(Math.sin(.63*t+seed)+.55*Math.sin(1.71*t+seed*2.3)+.3*Math.sin(3.1*t+seed*.7)),a*.8*(Math.sin(.51*t+seed*1.7)+.5*Math.sin(1.43*t+seed*.4)),.05*(Math.sin(.4*t+seed*3)+.4*Math.sin(1.3*t+seed))*amp/2]}
function stateAt(states,t){let lo=0,hi=states.length-1;if(t<states[0][0])return '';while(lo<hi){const m=(lo+hi+1)>>1;if(states[m][0]<=t)lo=m;else hi=m-1}return states[lo][1]}
window.READY=false;window.DUR=T_END;
const SENDS=MSGS.map(m=>m.sentAt);
window.setT=(t,frame)=>{
  SHOTS.forEach((s,i)=>{
    const nf=s.next?(s.next.fin||.02):0,vis0=s.t0,vis1=s.t1+nf;let a=0;
    if(t>=vis0-1e-4&&t<=vis1){a=(s.fin||0)>0?sm((t-s.t0)/s.fin):1;if(i===0)a=1}
    s.el.style.opacity=a;s.el.style.display=(t>=vis0-1e-4&&t<=vis1+.05)?'block':'none';
    if(a>0){const u=ease((t-s.t0)/(vis1-s.t0)),cam=s.cam,h=cam.hh?hh(t,i*1.9+.4,cam.hh*3.2):[0,0,0];
      const enterU=s.fin?clamp((t-s.t0)/s.fin):1,exitU=(s.next&&t>s.t1)?clamp((t-s.t1)/(s.next.fin||.02)):0;
      let fx=lerp(cam.f[0],cam.f[1],u),fy=s.oy/100,x=lerp(cam.x[0],cam.x[1],u)*W,y=lerp(cam.y[0],cam.y[1],u)*H,sc,roll=h[2];
      if(cam.focus&&s.focusPs){const uu=ei((t-cam.focus.t0)/(cam.focus.t1-cam.focus.t0)),P0=s.focusPs[0],P1=s.focusPs[1];fx=lerp(P0[0],P1[0],uu);fy=lerp(P0[1],P1[1],uu);sc=lerp(cam.s[0],cam.s[1],uu);x=(.5-fx)*W;y=(.5-fy)*H;
        let sh=0,shy=0;SENDS.forEach(ts=>{const dt=t-ts;if(dt>=0&&dt<.5){const e=Math.exp(-dt/.09);sh+=Math.sin(dt*85)*2*U*e;shy+=Math.cos(dt*70)*2.5*U*e}});x+=sh;y+=shy;
        if(cam.roll)roll+=lerp(cam.roll[0],cam.roll[1],u)}
      else{const need=Math.max((Math.abs(x+h[0])+3*U)/(W*Math.min(fx,1-fx)),(Math.abs(y+h[1])+3*U)/(H*Math.min(fy,1-fy)))+1.0;sc=Math.max(lerp(cam.s[0],cam.s[1],u),Math.min(need,1.7))}
      // transitions between shots
      let blur=0,bright=1;
      if(s.inFx==='push')sc*=1+.15*(1-eo3(enterU));
      if(s.inFx==='rack'){blur+=11*U*(1-eo3(enterU));sc*=1+.04*(1-eo3(enterU))}
      if(s.outFx==='push')sc*=1+.28*ei(exitU);
      if(s.outFx==='blur'){blur+=15*U*ei(exitU);sc*=1+.03*ei(exitU)}
      if(s.bloomUp){const bu=ei((t-s.t0-.4)/3.4);bright=.88+.22*bu;if(s.glowEl)s.glowEl.style.opacity=.34+.34*bu}
      s.camEl.style.transformOrigin=`${fx*W-s.cl}px ${fy*H-s.ct}px`;s.camEl.style.transform=`translate(${x+h[0]}px,${y+h[1]}px) rotate(${roll}deg) scale(${sc})`;
      const fl=1+.012*Math.sin(t*2.1+i)+.008*Math.sin(t*5.3+i*2);let tap=0;SENDS.forEach(ts=>{const dt=t-ts;if(s.ui&&dt>=-.03&&dt<.3)tap=Math.max(tap,.035*(dt<.05?sm((dt+.03)/.08):1-sm((dt-.05)/.25)))});
      s.camEl.style.filter=`brightness(${s.g.b*fl*bright*(1+tap)}) contrast(${s.g.c}) saturate(${s.g.sat||.9}) hue-rotate(${s.g.hue||0}deg)${s.blur?` blur(${s.blur*U}px)`:''}${blur>.05?` blur(${blur}px)`:''}`}
    if(s.ui&&a>0){
      let act=-1;MSGS.forEach((m,k)=>{if(t>=m.start-.25)act=k});
      let str='';if(act>=0){const m=MSGS[act];str=(m.sentAt!==null&&t>=m.sentAt)?'':stateAt(m.states,t)}
