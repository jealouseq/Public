<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>ЦПР — ролик</title>
<link rel="stylesheet" href="/promo3/fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{background:#000;overflow:hidden}
#stage{position:relative;overflow:hidden;background:#000;color:#f4efe4}
#photos{position:absolute;inset:0;filter:url(#grade)}
.shot{position:absolute;inset:0;overflow:hidden;opacity:0}
.cam{position:absolute;will-change:transform,filter}
.cam img{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.cam img.glow{mix-blend-mode:screen;opacity:.34}
.ui{position:absolute;left:0;top:0;transform-origin:0 0;mix-blend-mode:multiply;font-family:'Onest',sans-serif;color:#fff}
.ui .hd{position:absolute;left:0;right:0;top:56px;text-align:center;font:500 18px 'Onest';color:#0b2a3b;opacity:.7}
.ui .chip{position:absolute;left:50%;transform:translateX(-50%);padding:5px 16px;border-radius:16px;background:rgba(10,40,60,.2);color:#0b2a3b;font:600 18px 'Onest';white-space:nowrap}
.ui .bb{position:absolute;right:22px;max-width:290px;padding:12px 18px 8px;border-radius:24px 24px 5px 24px;background:#0f3249;font:500 29px/1.2 'Onest';letter-spacing:-.01em}
.ui .bb .m{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:2px;font:500 15px 'Onest';opacity:.8}
.ui .bb svg{width:20px;height:15px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ui .inp{position:absolute;left:20px;right:20px;top:790px;height:68px;border-radius:34px;border:2.5px solid #0f3249;background:rgba(255,255,255,.5)}
.ui .inp .tt{position:absolute;left:24px;top:0;line-height:63px;font:500 24px 'Onest';color:#0b2a3b;white-space:nowrap}
.ui .inp .cr{position:absolute;top:19px;width:2.5px;height:26px;background:#0b2a3b}
.ui .snd{position:absolute;right:7px;top:7px;width:50px;height:50px;border-radius:50%;background:#0f3249}
.ui .snd:after{content:"";position:absolute;left:15px;top:15px;width:18px;height:18px;border-top:4px solid #fff;border-right:4px solid #fff;transform:translateX(-3px) rotate(-45deg) scale(.8)}
#leak{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none;opacity:0;background:radial-gradient(90% 75% at 88% 12%,rgba(255,176,86,.95),rgba(255,122,58,.38) 46%,transparent 72%)}
#warm{position:absolute;inset:0;mix-blend-mode:soft-light;background:radial-gradient(120% 90% at 70% 20%,rgba(255,196,120,.32),rgba(255,160,90,.08) 60%,transparent);pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(125% 105% at 50% 46%,transparent 54%,rgba(0,0,0,.5));pointer-events:none}
#grain{position:absolute;inset:-60px;background:url(/promo3/video/grain.png);background-size:256px 256px;mix-blend-mode:overlay;opacity:.2;pointer-events:none}
#black{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.scrim{position:absolute;inset:0;pointer-events:none;opacity:0}
.tx{position:absolute;pointer-events:none}
.ln{overflow:hidden;padding:.06em 0 .14em;margin-bottom:-.06em}.ln span{display:block;will-change:transform,opacity,filter}
.pr{font-family:'Prata';font-weight:400;letter-spacing:-.01em;line-height:1.08;color:#f7f2e7;text-shadow:0 3px 26px rgba(0,0,0,.5)}
.ub{font-family:'Unbounded';font-weight:700;letter-spacing:-.02em;line-height:1.08;color:#f7f2e7;text-transform:uppercase;text-shadow:0 3px 26px rgba(0,0,0,.5)}
.sm{font-family:'Tektur';font-weight:600;letter-spacing:.22em;color:#f0b54a;text-transform:uppercase}
.draft{position:absolute;white-space:nowrap;font-family:'Prata';font-weight:400;letter-spacing:-.005em;color:#f7f2e7;text-shadow:0 2px 24px rgba(0,0,0,.6);display:none}
.draft .cur{display:inline-block;width:.07em;height:.95em;margin-left:.06em;vertical-align:-.12em;background:#f0b54a;box-shadow:0 0 14px rgba(240,181,74,.6)}
.draft .ck{display:inline-block;margin-left:.45em;vertical-align:-.02em;width:.62em;height:.46em;opacity:0}
#end{position:absolute;inset:0;opacity:0}
#end .mk{position:absolute;color:#f0b54a;display:grid;place-items:center;font-family:'Unbounded';font-weight:700}
#end .mk svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><filter id="grade" color-interpolation-filters="sRGB"><feComponentTransfer>
<feFuncR type="table" tableValues="0.018 0.085 0.30 0.62 0.915 0.985"/><feFuncG type="table" tableValues="0.016 0.075 0.285 0.605 0.9 0.97"/><feFuncB type="table" tableValues="0.03 0.095 0.285 0.57 0.84 0.925"/></feComponentTransfer></filter></defs></svg>
<div id="stage"><div id="photos"></div><div id="warm"></div><div id="scrims"></div><div id="leak"></div><div id="texts"></div><div id="end"></div><div id="vig"></div><div id="grain"></div><div id="black"></div></div>
<script src="/promo3/video/tl.js"></script>
<script>
'use strict';
const Q=new URLSearchParams(location.search),W=+Q.get('w')||1080,H=+Q.get('h')||1080,U=W/1080;
const stage=document.getElementById('stage');stage.style.width=W+'px';stage.style.height=H+'px';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),sm=x=>{x=clamp(x);return x*x*(3-2*x)},eo3=x=>1-Math.pow(1-clamp(x),3),lerp=(a,b,t)=>a+(b-a)*t,ease=x=>{x=clamp(x);return .45*x+.55*(x*x*(3-2*x))},ei=x=>{x=clamp(x);return x*x*x*(x*(x*6-15)+10)};
const {SHOTS,DRAFTS,TEXTS,END_T,T_END,LEAKS}=TL;
const photos=document.getElementById('photos'),scrims=document.getElementById('scrims'),texts=document.getElementById('texts');
const TICKSVG='<svg viewBox="0 0 34 25"><path d="M4 13l8 8L30 4"/></svg>';
// ---- homography (unit UI rect -> screen quad), CSS matrix3d
function homography(src,dst){const A=[],b=[];for(let i=0;i<4;i++){const [x,y]=src[i],[u,v]=dst[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v)}
 const n=8;for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];[b[c],b[p]]=[b[p],b[c]];for(let r=c+1;r<n;r++){const f=A[r][c]/A[c][c];for(let k=c;k<n;k++)A[r][k]-=f*A[c][k];b[r]-=f*b[c]}}
 const x=Array(n).fill(0);for(let r=n-1;r>=0;r--){let s=b[r];for(let k=r+1;k<n;k++)s-=A[r][k]*x[k];x[r]=s/A[r][r]}return x}
const UW=390,UH=900,QUAD=[[637,1206],[981,1142],[1254,1921],[889,1979]];
// ---- shots
SHOTS.forEach((s,i)=>{const d=document.createElement('div');d.className='shot';d.style.zIndex=i;const cam=document.createElement('div');cam.className='cam';
 const im=new Image();im.src='/promo3/video/photos/'+s.img+'.jpg';cam.appendChild(im);
 if(!s.blur&&!s.noGlow){const gl=new Image();gl.src=im.src;gl.className='glow';gl.style.filter=`blur(${26*U}px) brightness(1.55) contrast(1.6)`;cam.appendChild(gl)}
 if(s.ui){const u=document.createElement('div');u.className='ui';u.style.width=UW+'px';u.style.height=UH+'px';
  u.innerHTML=`<div class="hd">не в сети</div>
  <div class="chip" style="top:98px">3-й день</div><div class="bb" style="top:134px">Ты как?<div class="m">09:41 ${TICKSVG}</div></div>
  <div class="chip" style="top:228px">10-й день</div><div class="bb" style="top:264px">Напиши, как сможешь<div class="m">21:15 ${TICKSVG}</div></div>
  <div class="chip" style="top:392px">21-й день</div><div class="bb nb" style="top:428px;opacity:0">Всё хорошо. Мы ждём.<div class="m">23:58 ${TICKSVG}</div></div>
  <div class="inp"><span class="tt"></span><span class="cr"></span><div class="snd"></div></div>`;
  cam.appendChild(u);s.uiEl=u;s.uiTT=u.querySelector('.tt');s.uiCR=u.querySelector('.cr');s.uiNB=u.querySelector('.nb')}
 d.appendChild(cam);photos.appendChild(d);s.el=d;s.camEl=cam;s.im=im;s.next=SHOTS[i+1];
 const sc=document.createElement('div');sc.className='scrim';sc.style.background=`linear-gradient(180deg,rgba(0,0,0,.34) 0,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 38%,rgba(0,0,0,${s.scrim}) 100%)`;scrims.appendChild(sc);s.sc=sc});
function layout(s){const nw=s.im.naturalWidth,nh=s.im.naturalHeight,k=Math.max(W/nw,H/nh),cw=nw*k,ch=nh*k,cl=(W-cw)/2,ct=(H-ch)*s.oy/100;Object.assign(s,{k,cw,ch,cl,ct,nw,nh});
 Object.assign(s.camEl.style,{left:cl+'px',top:ct+'px',width:cw+'px',height:ch+'px'});
 if(s.ui){const kk=nw/2001,dst=QUAD.map(p=>[p[0]*kk*k,p[1]*kk*k]),h=homography([[0,0],[UW,0],[UW,UH],[0,UH]],dst);s.H=h;
  s.uiEl.style.transform=`matrix3d(${h[0]},${h[3]},0,${h[6]},${h[1]},${h[4]},0,${h[7]},0,0,1,0,${h[2]},${h[5]},0,1)`;
  const f=(ux,uy)=>{const w=h[6]*ux+h[7]*uy+1;return[(h[0]*ux+h[1]*uy+h[2])/w+cl,(h[3]*ux+h[4]*uy+h[5])/w+ct]};
  const c=s.cam.focus;if(c){const p=f(c.ui[0]*UW,c.ui[1]*UH);s.focusP=[p[0]/W,p[1]/H]}}}
// ---- typed drafts (Prata overlay)
const CK='<svg viewBox="0 0 34 25" fill="none" stroke="#f0b54a" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" style="overflow:visible;width:100%;height:100%"><path d="M4 13l8 8L30 4"/></svg>';
const LH=84*U,FS=66*U;
DRAFTS.forEach(d=>d.rows.forEach((r,i)=>{const e=document.createElement('div');e.className='draft';e.style.left=72*U+'px';e.style.top=(d.top*H+i*LH)+'px';e.style.fontSize=FS+'px';e.innerHTML='<span class="t"></span><span class="cur"></span><span class="ck">'+CK+'</span>';texts.appendChild(e);r.el=e;r.t=e.querySelector('.t');r.cur=e.querySelector('.cur');r.ck=e.querySelector('.ck')}));
TEXTS.forEach(t=>{const d=document.createElement('div');d.className='tx '+t.cls;d.style.left=72*U+'px';d.style.top=t.top*H+'px';d.style.fontSize=t.size*U+'px';
 t.lns=t.lines.map(l=>{const w=document.createElement('div');w.className='ln';const sp=document.createElement('span');sp.textContent=l;w.appendChild(sp);d.appendChild(w);return sp});
 if(t.sub){const s=document.createElement('div');s.className='sm';s.style.fontSize=24*U+'px';s.style.marginTop=26*U+'px';s.textContent=t.sub;d.appendChild(s);t.subEl=s}
 texts.appendChild(d);t.el=d});
// ---- end card
const end=document.getElementById('end'),R=75*U;
end.innerHTML=`<div class="mk" style="left:${72*U}px;top:${H*.2}px;width:${150*U}px;height:${150*U}px;font-size:${46*U}px"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="71" fill="none" stroke="#f0b54a" stroke-width="4" stroke-dasharray="446" stroke-dashoffset="446" stroke-linecap="round"/></svg><span style="opacity:0">ЦПР</span></div>
<div class="ub" style="position:absolute;left:${72*U}px;top:${H*.2+210*U}px;font-size:${72*U}px;width:${900*U}px">Центр<br>поисковых<br>решений</div>
<div class="pr" style="position:absolute;left:${72*U}px;top:${H*.2+210*U+3*78*U+40*U}px;font-size:${44*U}px;line-height:1.24;width:${880*U}px;color:#e8e2d3">Профессиональный розыск пропавших бойцов в зоне СВО</div>
<div class="sm" style="position:absolute;left:${72*U}px;right:${72*U}px;top:${H*.2+210*U+3*78*U+40*U+3*56*U+44*U}px;padding-top:${26*U}px;border-top:2px solid #f0b54a;font-size:${28*U}px;letter-spacing:.14em">Контакты — в описании канала</div>`;
const E=[...end.children],ring=end.querySelector('circle'),ringTxt=end.querySelector('.mk span');
const black=document.getElementById('black'),grain=document.getElementById('grain'),warm=document.getElementById('warm'),leak=document.getElementById('leak');
function hh(t,seed,amp){const a=amp*U;return [a*(Math.sin(.63*t+seed)+.55*Math.sin(1.71*t+seed*2.3)+.3*Math.sin(3.1*t+seed*.7)),a*.8*(Math.sin(.51*t+seed*1.7)+.5*Math.sin(1.43*t+seed*.4)),.05*(Math.sin(.4*t+seed*3)+.4*Math.sin(1.3*t+seed))*amp/2]}
function stateAt(states,t){let lo=0,hi=states.length-1;if(t<states[0][0])return '';while(lo<hi){const m=(lo+hi+1)>>1;if(states[m][0]<=t)lo=m;else hi=m-1}return states[lo][1]}
window.READY=false;window.DUR=T_END;
window.setT=(t,frame)=>{
  SHOTS.forEach((s,i)=>{
    const nf=s.next?(s.next.fin||.02):0,vis0=s.t0,vis1=s.t1+nf;let a=0;
    if(t>=vis0-1e-4&&t<=vis1){a=(s.fin||0)>0?sm((t-s.t0)/s.fin):1;if(i===0)a=1}
    s.el.style.opacity=a;s.el.style.display=(t>=vis0-1e-4&&t<=vis1+.05)?'block':'none';s.sc.style.opacity=a;
    if(a>0){const u=ease((t-s.t0)/(vis1-s.t0)),cam=s.cam,h=cam.hh?hh(t,i*1.9+.4,cam.hh*3.2):[0,0,0];
      let fx=lerp(cam.f[0],cam.f[1],u),fy=s.oy/100,x=lerp(cam.x[0],cam.x[1],u)*W,y=lerp(cam.y[0],cam.y[1],u)*H,sc;
      if(cam.focus&&s.focusP){const uu=ei((t-cam.focus.t0)/(cam.focus.t1-cam.focus.t0));fx=s.focusP[0];fy=s.focusP[1];sc=lerp(cam.s[0],cam.s[1],uu);x=(.5-fx)*W*uu;y=(.5-fy)*H*uu}
      else{const need=Math.max((Math.abs(x+h[0])+3*U)/(W*Math.min(fx,1-fx)),(Math.abs(y+h[1])+3*U)/(H*Math.min(fy,1-fy)))+1.0;sc=Math.max(lerp(cam.s[0],cam.s[1],u),Math.min(need,1.6))}
      s.camEl.style.transformOrigin=`${fx*W-s.cl}px ${fy*H-s.ct}px`;s.camEl.style.transform=`translate(${x+h[0]}px,${y+h[1]}px) rotate(${h[2]}deg) scale(${sc})`;
      const fl=1+.012*Math.sin(t*2.1+i)+.008*Math.sin(t*5.3+i*2),rack=i>0&&!s.blur?7*U*(1-eo3((t-s.t0)/1.3)):0;
      s.camEl.style.filter=`brightness(${s.g.b*fl}) contrast(${s.g.c}) saturate(.9)${s.blur?` blur(${s.blur*U}px)`:''}${rack>.05?` blur(${rack}px)`:''}`}
    if(s.ui&&a>0){const row=DRAFTS[s.ui===true?2:0].rows[0],str=stateAt(row.states,t),sent=row.sentAt!==null&&t>=row.sentAt;
      s.uiTT.textContent=sent?'':str;
      const last=row.keys.filter(k=>k.t<=t).pop(),since=last?t-last.t:9,typing=since<.45;
      s.uiCR.style.display=sent?'none':'block';s.uiCR.style.opacity=typing?1:(Math.floor(t/.53)%2===0?1:0);
      const tw=s.uiTT.getBoundingClientRect?s.uiTT.offsetWidth:0;s.uiCR.style.left=(24+tw+3)+'px';
      const k=sent?eo3((t-row.sentAt)/.5):0,ov=1+.05*Math.sin(Math.PI*clamp((t-row.sentAt)/.4));
      s.uiNB.style.opacity=k;s.uiNB.style.transform=`scale(${(.88+.12*k)*(sent?ov:1)})`;s.uiNB.style.transformOrigin='100% 100%'}
  });
  DRAFTS.forEach(d=>{if(d.screen){d.rows.forEach(r=>r.el.style.display='none');return}
    const fadeOut=1-clamp((t-d.hide)/.55);
    d.rows.forEach(r=>{const on=t>=r.start-.2&&t<d.hide+.7;r.el.style.display=on?'block':'none';if(!on)return;
      r.t.textContent=stateAt(r.states,t);
      const last=r.keys.filter(k=>k.t<=t).pop(),since=last?t-last.t:9,typing=since<.45,sent=r.sentAt!==null&&t>=r.sentAt;
      r.cur.style.display=(sent||t<r.start-.15)?'none':'inline-block';r.cur.style.opacity=typing?1:(Math.floor(t/.53)%2===0?1:0);
      const ck=r.el.querySelector('.ck'),k=sent?eo3((t-r.sentAt)/.45):0;ck.style.opacity=k;ck.style.transform=`translateY(${(1-k)*5}px)`;
      r.el.style.opacity=fadeOut*clamp((t-(r.start-.2))/.4)*(sent?1-.14*k:1)})});
  TEXTS.forEach(tx=>{const p0=t-tx.a,out=clamp((t-tx.b)/.5),per=tx.per||.16;
    tx.lns.forEach((sp,j)=>{const p=clamp((p0-j*per)/.95),e=eo3(p);sp.style.transform=`translateY(${(1-e)*108}%)`;sp.style.opacity=clamp(p*2.2)*(1-out);const bl=(1-e)*9*U;sp.style.filter=bl>.2?`blur(${bl}px)`:'none'});
    if(tx.subEl){const p=clamp((t-tx.subA)/.8);tx.subEl.style.opacity=clamp(p*1.6)*(1-out);tx.subEl.style.transform=`translateY(${(1-eo3(p))*10}px)`}
    tx.el.style.display=(t>tx.a-.05&&t<tx.b+.6)?'block':'none'});
  {const e=t-END_T;end.style.opacity=e>0?1:0;[0,.45,.95,1.9].forEach((dl,i)=>{const p=clamp((e-.7-dl)/.9);E[i].style.opacity=i===0?1:p;E[i].style.transform=`translateY(${(1-eo3(p))*14*U}px)`});
   const rp=clamp((e-.7)/1.5);ring.setAttribute('stroke-dashoffset',String(446*(1-ei(rp))));ringTxt.style.opacity=clamp((e-1.5)/.7)}
  // light leaks on the cuts
  let lk=0;LEAKS.forEach(L=>{lk=Math.max(lk,.38*Math.exp(-Math.pow((t-L-.15)/.5,2)))});leak.style.opacity=lk;
  let bl=0;if(t<1.6)bl=1-sm(t/1.6);
  const dipA=END_T-.95;if(t>dipA&&t<=END_T)bl=Math.max(bl,sm((t-dipA)/.95));if(t>END_T&&t<END_T+.9)bl=Math.max(bl,1-sm((t-END_T-.15)/.75));
  if(t>T_END-1.4)bl=Math.max(bl,sm((t-(T_END-1.4))/1.4));black.style.opacity=bl;
  const fr=frame||0;grain.style.backgroundPosition=`${(fr*53)%256}px ${(fr*97)%256}px`;grain.style.opacity=.17+.04*Math.sin(t*1.3);warm.style.opacity=.6+.15*Math.sin(t*.4);
};
(async()=>{await document.fonts.ready;await Promise.all(SHOTS.map(s=>s.im.decode().catch(()=>{})));SHOTS.forEach(layout);window.READY=true})();
</script></body></html>
